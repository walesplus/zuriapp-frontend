
name: Frontend CI

on:
  push:
    branches:
      - main
      - feature/frontend
      - feature/nginx-security
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Security Checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ""
          VITE_STORE_NAME: Zuri Store

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL="" \
            --build-arg VITE_STORE_NAME="Zuri Store" \
            -t zuriapp-frontend:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zuriapp-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/zuriapp-frontend
          SHA: ${{ github.sha }}
        run: |
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          docker tag zuriapp-frontend:$SHA "$IMAGE_LOWER:$SHA"
          docker push "$IMAGE_LOWER:$SHA"
